services:
  - type: web
    name: inventario-autopass
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --graceful-timeout 30
    healthCheckPath: /health
    envVars:
      - key: INVENTARIO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
