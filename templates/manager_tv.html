<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modo TV | Inventário Autopass</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:#071b31;color:#fff}.tv{height:100vh;display:grid;grid-template-rows:64px 1fr 28px;padding:14px 20px;gap:10px;background:radial-gradient(circle at 78% 10%,#174f73 0,#0b2948 38%,#06172b 100%)}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2c5876}.ey{font-size:11px;letter-spacing:2px;color:#25ddff;font-weight:900}.top h1{margin:3px 0 0;font-size:26px}.clock{text-align:right}.clock b{font-size:26px}.clock small{display:block;color:#9cc1d7}.slide{display:none;min-height:0}.slide.active{display:grid}.overview{grid-template-rows:92px 1fr;gap:12px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kpi{padding:12px 15px;background:linear-gradient(145deg,#123e69,#0d2d50);border-radius:14px;border-bottom:4px solid #25d9ff}.kpi:nth-child(2){border-color:#22d69c}.kpi:nth-child(3){border-color:#ff536f}.kpi:nth-child(5){border-color:#ffae30}.kpi:nth-child(6){border-color:#8c6cff}.kpi span{font-size:11px;color:#a8cadc;font-weight:800}.kpi b{display:block;font-size:31px;margin-top:4px}.grid{display:grid;grid-template-columns:1.05fr 1.65fr 1.45fr 1.4fr;gap:12px;min-height:0}.panel{background:#f7fbff;color:#102b48;border-radius:16px;padding:16px;overflow:hidden}.panel h2{font-size:16px;margin:0 0 10px}.donutPanel{background:linear-gradient(155deg,#0a3155,#0b687d);color:#fff;display:grid;place-items:center}.donut{--p:0%;width:min(18vw,220px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#0b3b5b 57%,transparent 58%),conic-gradient(#21dc9f var(--p),#164765 0);display:grid;place-items:center;align-content:center;box-shadow:0 0 0 10px #104561}.donut b{font-size:44px}.donut small{color:#b9f2e4}.bars{height:calc(100% - 28px);display:flex;align-items:end;gap:7px;padding:16px 4px}.bars i{flex:1;min-height:3px;background:linear-gradient(#25dfff,#267fff);border-radius:6px 6px 0 0;position:relative}.bars i span{position:absolute;top:-18px;width:100%;text-align:center;font-size:10px}.types,.rank{display:grid;gap:9px}.row{display:grid;grid-template-columns:72px 1fr 42px;gap:8px;align-items:center;font-size:12px}.track{height:10px;background:#e4edf4;border-radius:20px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#13cfa1,#2885ff);border-radius:20px}.rank .row{grid-template-columns:24px 1fr 40px}.rank em{font-style:normal;background:#123c67;color:#fff;border-radius:50%;width:23px;height:23px;display:grid;place-items:center}.full{grid-template-columns:1fr!important}.bigmap{height:100%;border-radius:16px;overflow:hidden}.footer{display:flex;justify-content:space-between;color:#8cb5cc;font-size:11px}.dots{display:flex;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:#355c76}.dot.active{background:#24dcff}.titleOnly{display:grid;grid-template-rows:72px 1fr;gap:12px}.titleOnly .headline{font-size:22px;font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}.metricGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#f7fbff;color:#102b48;border-radius:16px;padding:18px}.metric b{font-size:40px;display:block}.progress{height:12px;background:#e3ecf3;border-radius:20px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#1ad7a0,#27a9ff)}
</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div class="tv"><header class="top"><div><span class="ey">INVENTÁRIO AUTOPASS · AO VIVO</span><h1 id="slideTitle">Central de Inteligência do Inventário</h1></div><div class="clock"><b id="clock">--:--</b><small id="updated">Atualizando…</small></div></header><main id="slides"></main><footer class="footer"><span id="status">SUPORTE A CAMPO · {{ app_release }}</span><div class="dots" id="dots"></div><span>← → navegar · Espaço pausar · Esc sair</span></footer></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const S=document.getElementById('slides');let data=null,locs=[],idx=0,timer=null,paused=false,map=null;const fmt=n=>new Intl.NumberFormat('pt-BR').format(Number(n||0));const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function overview(){const t=data.totals||{},i=data.inventory||{},ex=+t.expected||0,done=+(i.official_inventoried??i.inventoried)||0,cv=pct(done,ex),trend=data.trend_14d||[],mx=Math.max(1,...trend.map(x=>+x.count||0)),types=data.by_type||[];const td=trend.slice(-7).reduce((a,x)=>a+(+x.count||0),0)/7;const proj=td>0?Math.ceil(Math.max(0,ex-done)/td):0;const pri=locs.map(x=>{let e=Object.values(x.expected_by_type||{}).reduce((a,b)=>a+(+b||0),0),v=Object.values(x.inventoried_by_type||{}).reduce((a,b)=>a+(+b||0),0);return {...x,m:Math.max(0,e-v)}}).filter(x=>x.m).sort((a,b)=>b.m-a.m).slice(0,6);return `<section class="slide overview active"><div class="kpis">${[['Parque previsto',ex],['Inventariado',done],['Faltante',Math.max(0,ex-done)],['Conclusão',cv+'%'],['Ritmo 7 dias',td.toFixed(1).replace('.',',')+'/dia'],['Projeção',proj?proj+' dias':'—']].map((x,j)=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="grid"><div class="panel donutPanel"><h2>Cobertura do parque</h2><div class="donut" style="--p:${cv}%"><b>${cv}%</b><small>concluído</small></div><p>${fmt(done)} de ${fmt(ex)} ativos</p></div><div class="panel"><h2>Evolução · 14 dias</h2><div class="bars">${trend.map(x=>`<i style="height:${Math.max(3,Math.round((+x.count||0)/mx*100))}%"><span>${fmt(x.count)}</span></i>`).join('')}</div></div><div class="panel"><h2>Execução por tipo</h2><div class="types">${types.slice(0,6).map(x=>{let e=+x.expected||0,v=+x.inventoried||0,p=pct(v,e);return `<div class="row"><b>${esc(x.type||'')}</b><div class="track"><i style="width:${p}%"></i></div><strong>${p}%</strong></div>`}).join('')}</div></div><div class="panel"><h2>Top prioridades</h2><div class="rank">${pri.map((x,j)=>`<div class="row"><em>${j+1}</em><div><b>${esc(x.location)}</b><div class="track"><i style="width:${Math.round(x.m/Math.max(1,pri[0].m)*100)}%;background:#f0a51d"></i></div></div><strong>${x.m}</strong></div>`).join('')}</div></div></div></section>`}
function execution(){const t=data.totals||{},i=data.inventory||{},trend=data.trend_14d||[],mx=Math.max(1,...trend.map(x=>+x.count||0));return `<section class="slide titleOnly"><div class="headline">Execução e produtividade</div><div class="two"><div class="panel"><h2>Ritmo diário · 14 dias</h2><div class="bars">${trend.map(x=>`<i style="height:${Math.max(3,Math.round((+x.count||0)/mx*100))}%"><span>${x.count||0}</span></i>`).join('')}</div></div><div class="metricGrid"><div class="metric"><span>Inventariados</span><b>${fmt(i.official_inventoried??i.inventoried)}</b></div><div class="metric"><span>Pendentes</span><b>${fmt(t.missing)}</b></div><div class="metric"><span>Divergências</span><b>${fmt(i.divergences)}</b></div><div class="metric"><span>Inoperantes</span><b>${fmt(i.inoperative)}</b></div><div class="metric"><span>Localidades</span><b>${fmt(t.total)}</b></div><div class="metric"><span>Concluídas</span><b>${fmt(t.completed)}</b></div></div></div></section>`}
function quality(){const i=data.inventory||{},e=data.evidence||{};return `<section class="slide titleOnly"><div class="headline">Qualidade e atenção gerencial</div><div class="metricGrid"><div class="metric"><span>Divergências</span><b>${fmt(i.divergences)}</b></div><div class="metric"><span>Inoperantes</span><b>${fmt(i.inoperative)}</b></div><div class="metric"><span>Evidências para revisar</span><b>${fmt(e.review)}</b></div><div class="metric"><span>Visitas sem vínculo</span><b>${fmt(e.unresolved_visits)}</b></div><div class="metric"><span>Fotos/vídeos</span><b>${fmt(e.media)}</b></div><div class="metric"><span>Itens evidenciados</span><b>${fmt(e.items)}</b></div></div></section>`}
function mapSlide(){return `<section class="slide full"><div id="tvMap" class="bigmap"></div></section>`}
function ranking(){let pri=locs.map(x=>{let e=Object.values(x.expected_by_type||{}).reduce((a,b)=>a+(+b||0),0),v=Object.values(x.inventoried_by_type||{}).reduce((a,b)=>a+(+b||0),0);return {...x,m:Math.max(0,e-v)}}).filter(x=>x.m).sort((a,b)=>b.m-a.m).slice(0,12);return `<section class="slide titleOnly"><div class="headline">Ranking de prioridades</div><div class="panel"><div class="rank">${pri.map((x,j)=>`<div class="row"><em>${j+1}</em><div><b>${esc(x.location)} · ${esc(x.line||'')}</b><div class="track"><i style="width:${Math.round(x.m/Math.max(1,pri[0].m)*100)}%;background:linear-gradient(90deg,#ffae30,#ff694d)"></i></div></div><strong>${x.m}</strong></div>`).join('')}</div></div></section>`}
const builders=[overview,execution,quality,mapSlide,ranking],titles=['Visão Geral','Execução','Qualidade','Mapa','Ranking'];function render(){S.innerHTML=builders[idx]();document.getElementById('slideTitle').textContent=titles[idx]+' · Inventário Autopass';document.getElementById('dots').innerHTML=builders.map((_,j)=>`<i class="dot ${j===idx?'active':''}"></i>`).join('');if(idx===3)setTimeout(initMap,50)}function next(d=1){idx=(idx+d+builders.length)%builders.length;render()}function resetTimer(){clearInterval(timer);if(!paused)timer=setInterval(()=>next(1),12000)}async function initMap(){if(map){map.remove();map=null}map=L.map('tvMap',{zoomControl:true}).setView([-23.55,-46.63],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);try{const g=await fetch('/api/gps/recent?limit=100',{cache:'no-store'}).then(r=>r.json());(g.items||g.rows||g||[]).forEach(x=>{if(Number.isFinite(+x.latitude)&&Number.isFinite(+x.longitude))L.circleMarker([+x.latitude,+x.longitude],{radius:7}).addTo(map)})}catch(e){}}
async function load(){[data,locs]=await Promise.all([fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json()),fetch('/api/locations',{cache:'no-store'}).then(r=>r.json())]);render();resetTimer();document.getElementById('updated').textContent='Atualizado '+new Date().toLocaleString('pt-BR')}setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},1000);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){next(1);resetTimer()}if(e.key==='ArrowLeft'){next(-1);resetTimer()}if(e.code==='Space'){e.preventDefault();paused=!paused;resetTimer()}if(e.key==='Escape')window.close()});load();
</script></body></html>
