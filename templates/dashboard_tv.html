<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modo TV Dashboards</title><style>html,body{margin:0;height:100%;background:#061f38}iframe{border:0;width:100%;height:100vh;background:#fff}.tvBadge{position:fixed;z-index:9;right:14px;top:10px;background:#082f55;color:white;padding:7px 11px;border-radius:999px;font:600 12px Arial}</style></head><body>{% if dashboards %}<div class="tvBadge" id="tvBadge"></div><iframe id="tvFrame"></iframe><script>const ds={{ dashboards|tojson }};let i=0,t;function show(){let d=ds[i];tvFrame.src='/dashboards/'+d.slug;tvBadge.textContent=(i+1)+'/'+ds.length+' · '+d.name+' · '+d.tv_seconds+'s';clearTimeout(t);t=setTimeout(()=>{i=(i+1)%ds.length;show()},(d.tv_seconds||30)*1000)}show()</script>{% else %}<div style="color:white;font:20px Arial;padding:40px">Nenhuma dashboard foi selecionada para o Modo TV.</div>{% endif %}</body></html>
